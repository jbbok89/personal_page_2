<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Project View</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/view.css">
</head>
<body>

  <div class="sidebar">
    <div class="profile">
      <h2>Lee Jehui</h2>
      <p>jbbok89@gmail.com</p>
    </div>

    <div class="menu">
      <ul>
        <li><a href="index.html">Profile</a></li>
        <li><a href="project.html" class="active">Project</a></li>
        <li><a href="study.html">Study</a></li>
      </ul>
    </div>
  </div>

  <div class="content">
    <div class="img_container">
      <img id="project-image" class="origin_img">
    </div>

    <article class="project_detail">
      <div class="container">

        <h1 id="project-title" class="project_title"></h1>

        <section class="detail_section">
          <h2 class="section_title">프로젝트 개요</h2>

          <ul class="detail_list">
            <li>
              <strong>프로젝트 기간:</strong>
              <span id="project-period"></span>
            </li>

            <li>
              <strong>내용:</strong>
              <span id="project-content"></span>
            </li>
          </ul>
        </section>

        <section class="detail_section">
          <h2 class="section_title">목표</h2>

          <ul id="project-goals" class="detail_list"></ul>
        </section>
 
        <div id="extra-sections"></div>

        <section class="detail_section">
          <h2 class="section_title">주 역할</h2>

          <ul id="project-roles" class="detail_list"></ul>
        </section>

        <section class="detail_section">
          <h2 class="section_title">Link</h2>

          <ul id="project-links" class="detail_list">
          </ul>
        </section>
      </div>
    </article>

  </div>

  <script src="js/project_detail.js"></script>

</body>
</html>
